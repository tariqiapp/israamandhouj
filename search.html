<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rechercher un trajet — Tariqi</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="search.css" />
  </head>
  <body class="search-page">
    <div data-component="components/header.html"></div>

    <main class="search-main">
      <section class="search-strip">
        <form class="search-strip-form" id="search-strip-form">
          <div class="strip-field">
            <span class="strip-icon" aria-hidden="true">📍</span>
            <input id="strip-from" type="text" placeholder="Ville de départ" />
          </div>
          <span class="strip-arrow" aria-hidden="true">→</span>
          <div class="strip-field">
            <span class="strip-icon" aria-hidden="true">🏁</span>
            <input id="strip-to" type="text" placeholder="Ville d'arrivée" />
          </div>
          <div class="strip-field">
            <span class="strip-icon" aria-hidden="true">📅</span>
            <input id="strip-date" type="date" />
          </div>
          <button class="strip-submit" type="submit">Rechercher</button>
        </form>
      </section>

      <section class="search-layout">
        <aside class="filters">
          <div class="filters-mobile">
            <div class="filters-mobile-chips">
              <button class="sort-chip" type="button" data-sort="price_asc">Prix croissant</button>
              <button class="sort-chip" type="button" data-sort="price_desc">Prix décroissant</button>
              <button class="sort-chip" type="button" data-sort="date_asc">Départ le plus tôt</button>
            </div>
            <button class="filters-toggle" type="button">Filtres</button>
          </div>

          <div class="filters-card" id="filters-card">
            <div class="filters-section">
              <p class="filters-title">Trier par</p>
              <div class="filters-chips">
                <button class="sort-chip" type="button" data-sort="price_asc">Prix croissant</button>
                <button class="sort-chip" type="button" data-sort="price_desc">Prix décroissant</button>
                <button class="sort-chip" type="button" data-sort="date_asc">Départ le plus tôt</button>
              </div>
            </div>

            <div class="filters-section">
              <p class="filters-title">Prix</p>
              <div class="range-wrapper">
                <div class="range-track">
                  <div class="range-fill" id="price-range-fill"></div>
                </div>
                <input id="price-min" class="range-input" type="range" min="0" max="200" value="0" />
                <input id="price-max" class="range-input" type="range" min="0" max="200" value="200" />
              </div>
              <p class="range-label" id="price-range-label">0 DT — 200 DT</p>
            </div>

            <div class="filters-section">
              <p class="filters-title">Places disponibles</p>
              <div class="stepper">
                <button class="stepper-btn" type="button" data-step="-1">−</button>
                <span class="stepper-value" id="seats-value">1</span>
                <button class="stepper-btn" type="button" data-step="1">+</button>
              </div>
              <p class="stepper-label" id="seats-label">1+ place disponible</p>
            </div>

            <div class="filters-section">
              <p class="filters-title">Date</p>
              <input id="filter-date" class="filter-date" type="date" />
            </div>

            <button class="filters-reset" type="button">Réinitialiser les filtres</button>
          </div>
        </aside>

        <div class="results">
          <p class="results-count" id="results-count">0 trajets trouvés</p>
          <div id="results-list"></div>

          <div id="results-empty" class="results-empty">
            <div class="empty-illustration" aria-hidden="true">
              <svg viewBox="0 0 120 80" width="120" height="80">
                <path
                  d="M10 60 C35 40, 85 40, 110 60"
                  stroke="#cbd5e1"
                  stroke-width="4"
                  fill="none"
                />
                <circle cx="30" cy="60" r="6" fill="#cbd5e1" />
                <circle cx="90" cy="60" r="6" fill="#cbd5e1" />
              </svg>
            </div>
            <p>Aucun trajet trouvé pour cette recherche.</p>
            <span>Essayez de modifier vos filtres.</span>
            <button class="filters-reset" type="button">Réinitialiser</button>
          </div>

          <div id="results-pagination" class="pagination"></div>
        </div>
      </section>
    </main>

    <div data-component="auth-modal.html"></div>
    <div data-component="components/footer.html"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/components.js"></script>
    <script src="script.js"></script>
    <script src="auth-ui.js"></script>
    <script src="search.js"></script>
  </body>
</html>
