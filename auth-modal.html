<div id="auth-modal" class="auth-overlay" aria-hidden="true">
  <div class="auth-card" role="dialog" aria-modal="true" aria-label="Authentification Tariqi">
    <button class="auth-close" type="button" aria-label="Fermer">×</button>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" type="button" role="tab" aria-selected="true" data-tab="login">
        Connexion
      </button>
      <button class="auth-tab" type="button" role="tab" aria-selected="false" data-tab="register">
        Inscription
      </button>
    </div>

    <div class="auth-global-error" role="alert"></div>

    <form class="auth-form is-active" data-form="login" novalidate>
      <div class="auth-field" data-field="email">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="votre@email.com" autocomplete="email" />
        <div class="auth-error" aria-live="polite">
          <span class="auth-error-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12">
              <circle cx="8" cy="8" r="7" fill="currentColor" />
              <rect x="7.25" y="4" width="1.5" height="5" fill="#ffffff" />
              <rect x="7.25" y="10.5" width="1.5" height="1.5" fill="#ffffff" />
            </svg>
          </span>
          <span class="auth-error-text"></span>
        </div>
      </div>

      <div class="auth-field" data-field="password">
        <label for="login-password">Mot de passe</label>
        <div class="auth-input-wrap">
          <input
            id="login-password"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            data-password
          />
          <button class="auth-toggle" type="button" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                class="eye-open"
                fill="currentColor"
                d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"
              />
              <path
                class="eye-closed"
                fill="currentColor"
                d="M4.27 3 3 4.27l3.02 3.02A11.9 11.9 0 0 0 1 12c1.73 3.89 6 7 11 7 2.01 0 3.9-.5 5.52-1.36L19.73 21 21 19.73 4.27 3Zm7.73 13a4 4 0 0 1-4-4c0-.62.14-1.2.38-1.73l5.35 5.35c-.53.24-1.11.38-1.73.38Zm3.66-1.34-1.52-1.52A3.98 3.98 0 0 0 8.86 7.86L7.3 6.3A9.42 9.42 0 0 1 12 5c5 0 9.27 3.11 11 7a12.9 12.9 0 0 1-5.34 5.66Z"
              />
            </svg>
          </button>
        </div>
        <div class="auth-error" aria-live="polite">
          <span class="auth-error-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12">
              <circle cx="8" cy="8" r="7" fill="currentColor" />
              <rect x="7.25" y="4" width="1.5" height="5" fill="#ffffff" />
              <rect x="7.25" y="10.5" width="1.5" height="1.5" fill="#ffffff" />
            </svg>
          </span>
          <span class="auth-error-text"></span>
        </div>
      </div>

      <button
        class="auth-submit"
        type="submit"
        data-loading-text="Connexion..."
        data-default-label="Se connecter"
      >
        <span class="auth-submit-label">Se connecter</span>
        <span class="auth-submit-spinner" aria-hidden="true"></span>
      </button>
    </form>

    <form class="auth-form" data-form="register" novalidate>
      <div class="auth-field" data-field="name">
        <label for="register-name">Prénom &amp; Nom</label>
        <input id="register-name" type="text" placeholder="Votre nom complet" autocomplete="name" />
        <div class="auth-error" aria-live="polite">
          <span class="auth-error-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12">
              <circle cx="8" cy="8" r="7" fill="currentColor" />
              <rect x="7.25" y="4" width="1.5" height="5" fill="#ffffff" />
              <rect x="7.25" y="10.5" width="1.5" height="1.5" fill="#ffffff" />
            </svg>
          </span>
          <span class="auth-error-text"></span>
        </div>
      </div>

      <div class="auth-field" data-field="email">
        <label for="register-email">Email</label>
        <input id="register-email" type="email" placeholder="votre@email.com" autocomplete="email" />
        <div class="auth-error" aria-live="polite">
          <span class="auth-error-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12">
              <circle cx="8" cy="8" r="7" fill="currentColor" />
              <rect x="7.25" y="4" width="1.5" height="5" fill="#ffffff" />
              <rect x="7.25" y="10.5" width="1.5" height="1.5" fill="#ffffff" />
            </svg>
          </span>
          <span class="auth-error-text"></span>
        </div>
      </div>

      <div class="auth-field" data-field="password">
        <label for="register-password">Mot de passe</label>
        <div class="auth-input-wrap">
          <input
            id="register-password"
            type="password"
            placeholder="Min. 6 caractères"
            autocomplete="new-password"
            data-password
          />
          <button class="auth-toggle" type="button" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                class="eye-open"
                fill="currentColor"
                d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"
              />
              <path
                class="eye-closed"
                fill="currentColor"
                d="M4.27 3 3 4.27l3.02 3.02A11.9 11.9 0 0 0 1 12c1.73 3.89 6 7 11 7 2.01 0 3.9-.5 5.52-1.36L19.73 21 21 19.73 4.27 3Zm7.73 13a4 4 0 0 1-4-4c0-.62.14-1.2.38-1.73l5.35 5.35c-.53.24-1.11.38-1.73.38Zm3.66-1.34-1.52-1.52A3.98 3.98 0 0 0 8.86 7.86L7.3 6.3A9.42 9.42 0 0 1 12 5c5 0 9.27 3.11 11 7a12.9 12.9 0 0 1-5.34 5.66Z"
              />
            </svg>
          </button>
        </div>
        <div class="auth-strength">
          <div class="auth-strength-bar">
            <span class="auth-strength-fill"></span>
          </div>
          <span class="auth-strength-label"></span>
        </div>
        <div class="auth-error" aria-live="polite">
          <span class="auth-error-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12">
              <circle cx="8" cy="8" r="7" fill="currentColor" />
              <rect x="7.25" y="4" width="1.5" height="5" fill="#ffffff" />
              <rect x="7.25" y="10.5" width="1.5" height="1.5" fill="#ffffff" />
            </svg>
          </span>
          <span class="auth-error-text"></span>
        </div>
      </div>

      <div class="auth-field" data-field="confirm">
        <label for="register-confirm">Confirmer</label>
        <div class="auth-input-wrap">
          <input
            id="register-confirm"
            type="password"
            placeholder="Confirmez votre mot de passe"
            autocomplete="new-password"
            data-password
          />
          <button class="auth-toggle" type="button" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                class="eye-open"
                fill="currentColor"
                d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"
              />
              <path
                class="eye-closed"
                fill="currentColor"
                d="M4.27 3 3 4.27l3.02 3.02A11.9 11.9 0 0 0 1 12c1.73 3.89 6 7 11 7 2.01 0 3.9-.5 5.52-1.36L19.73 21 21 19.73 4.27 3Zm7.73 13a4 4 0 0 1-4-4c0-.62.14-1.2.38-1.73l5.35 5.35c-.53.24-1.11.38-1.73.38Zm3.66-1.34-1.52-1.52A3.98 3.98 0 0 0 8.86 7.86L7.3 6.3A9.42 9.42 0 0 1 12 5c5 0 9.27 3.11 11 7a12.9 12.9 0 0 1-5.34 5.66Z"
              />
            </svg>
          </button>
        </div>
        <div class="auth-error" aria-live="polite">
          <span class="auth-error-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12">
              <circle cx="8" cy="8" r="7" fill="currentColor" />
              <rect x="7.25" y="4" width="1.5" height="5" fill="#ffffff" />
              <rect x="7.25" y="10.5" width="1.5" height="1.5" fill="#ffffff" />
            </svg>
          </span>
          <span class="auth-error-text"></span>
        </div>
      </div>

      <button
        class="auth-submit"
        type="submit"
        data-loading-text="Création..."
        data-default-label="Créer mon compte"
      >
        <span class="auth-submit-label">Créer mon compte</span>
        <span class="auth-submit-spinner" aria-hidden="true"></span>
      </button>
    </form>
  </div>
</div>
